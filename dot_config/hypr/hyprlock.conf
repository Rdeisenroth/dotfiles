general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = Noto Sans
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] LC_TIME=de_DE.UTF-8 date +"%A, %d. %B %Y"
    color = rgba(220, 220, 220, 1.0)
    font_size = 22
    font_family = Noto Sans
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 193, 7, 1.0)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Passwort eingeben...</i>
    check_text = <i>Prüfe Anmeldedaten...</i>
    fail_text = <i>Falsches Passwort ($ATTEMPTS)</i>
    hide_input = false
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = Wilkommen zurück, $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = Noto Sans
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = ⏻  Suspend
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = Noto Sans
    position = 0, -100
    halign = center
    valign = center
    onclick = systemctl suspend
}
